<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Tutorial</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
    #status { font-weight: bold; }
    .on { color: green; } .off { color: crimson; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; margin: 12px 0; background: #fafafa; }
    #log div { margin: 2px 0; }
    .system { color: #888; font-style: italic; }
    .me { color: #0055cc; }
    form { display: flex; gap: 8px; }
    #input { flex: 1; padding: 6px; }
  </style>
</head>
<body>
  <h1>WebSocket 채팅 튜토리얼</h1>
  <p>상태: <span id="status" class="off">연결 안 됨</span> · 내 ID: <span id="myId">-</span> · 접속자: <span id="count">0</span></p>
  <button id="connectBtn">연결</button>
  <button id="disconnectBtn" disabled>연결 끊기</button>

  <div id="log"></div>

  <form id="form">
    <input id="input" placeholder="메시지를 입력하세요" autocomplete="off" disabled />
    <button id="sendBtn" disabled>전송</button>
  </form>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws = null;
    let myId = null;

    function log(text, cls) {
      const div = document.createElement('div');
      div.textContent = text;
      if (cls) div.className = cls;
      $('log').appendChild(div);
      $('log').scrollTop = $('log').scrollHeight;
    }

    function setConnected(on) {
      $('status').textContent = on ? '연결됨' : '연결 안 됨';
      $('status').className = on ? 'on' : 'off';
      $('connectBtn').disabled = on;
      $('disconnectBtn').disabled = !on;
      $('input').disabled = !on;
      $('sendBtn').disabled = !on;
    }

    function connect() {
      // 페이지를 제공한 서버와 같은 호스트로 WebSocket 연결
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = location.host ? `${protocol}://${location.host}` : 'ws://localhost:8080';
      ws = new WebSocket(url);

      // 1) 연결 성공
      ws.onopen = () => {
        setConnected(true);
        log(`서버에 연결되었습니다 (${url})`, 'system');
      };

      // 2) 서버로부터 메시지 수신
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
          case 'welcome':
            myId = msg.id;
            $('myId').textContent = '#' + myId;
            break;
          case 'system':
            $('count').textContent = msg.count;
            log(msg.text, 'system');
            break;
          case 'chat': {
            const time = new Date(msg.time).toLocaleTimeString();
            const who = msg.from === myId ? '나' : `#${msg.from}`;
            log(`[${time}] ${who}: ${msg.text}`, msg.from === myId ? 'me' : '');
            break;
          }
          case 'error':
            log('오류: ' + msg.text, 'system');
            break;
        }
      };

      // 3) 연결 종료
      ws.onclose = () => {
        setConnected(false);
        $('myId').textContent = '-';
        $('count').textContent = '0';
        log('연결이 종료되었습니다', 'system');
      };

      // 4) 오류
      ws.onerror = () => log('WebSocket 오류가 발생했습니다', 'system');
    }

    $('connectBtn').onclick = connect;
    $('disconnectBtn').onclick = () => ws && ws.close();

    // 메시지 전송
    $('form').onsubmit = (e) => {
      e.preventDefault();
      const text = $('input').value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'chat', text }));
      $('input').value = '';
    };

    connect(); // 페이지 로드 시 자동 연결
  </script>
</body>
</html>
